  <linearGradient id="sapphire" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3db2ff"/><stop offset=".45" stop-color="#168FEA"/><stop offset="1" stop-color="#103B63"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".94"/><stop offset=".5" stop-color="#c9eeff" stop-opacity=".62"/><stop offset="1" stop-color="#168FEA" stop-opacity=".25"/></linearGradient>
  <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset=".22" stop-color="#a9c7d8"/><stop offset=".5" stop-color="#ffffff"/><stop offset=".72" stop-color="#7f9fb2"/><stop offset="1" stop-color="#f9feff"/></linearGradient>
