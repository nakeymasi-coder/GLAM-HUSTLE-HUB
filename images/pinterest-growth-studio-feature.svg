<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Pinterest Growth Studio app mockup</title>
<desc id="desc">Luxury navy and gold phone and tablet mockup for Pinterest Growth Studio.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05070d"/><stop offset=".55" stop-color="#07152d"/><stop offset="1" stop-color="#020308"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff2b0"/><stop offset=".42" stop-color="#d4af37"/><stop offset="1" stop-color="#8e6816"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#000" flood-opacity=".65"/></filter>
</defs>
<rect width="1200" height="900" fill="url(#bg)"/>
<circle cx="850" cy="180" r="340" fill="#173766" opacity=".18"/>
<ellipse cx="610" cy="810" rx="500" ry="45" fill="#d4af37" opacity=".10"/>
<g filter="url(#shadow)">
  <rect x="350" y="80" width="610" height="700" rx="42" fill="#05070b" stroke="url(#gold)" stroke-width="7"/>
  <rect x="380" y="115" width="550" height="630" rx="24" fill="#071225" stroke="#26344e"/>
  <text x="420" y="200" fill="url(#gold)" font-family="Georgia,serif" font-size="58" letter-spacing="4">PINTEREST</text>
  <text x="420" y="265" fill="url(#gold)" font-family="Georgia,serif" font-size="58" letter-spacing="4">GROWTH</text>
  <text x="420" y="330" fill="url(#gold)" font-family="Georgia,serif" font-size="58" letter-spacing="4">STUDIO</text>
  <line x1="420" y1="360" x2="650" y2="360" stroke="#d4af37" stroke-width="3"/>
  <g font-family="Montserrat,Arial,sans-serif" font-size="24" fill="#fff" letter-spacing="2">
    <rect x="410" y="410" width="490" height="84" rx="15" fill="#0d1017" stroke="#2a2f3b"/><text x="450" y="462">PIN REVIEW</text><text x="850" y="462" fill="#d4af37">›</text>
    <rect x="410" y="515" width="490" height="84" rx="15" fill="#0d1017" stroke="#2a2f3b"/><text x="450" y="567">LESSONS</text><text x="850" y="567" fill="#d4af37">›</text>
    <rect x="410" y="620" width="490" height="84" rx="15" fill="#0d1017" stroke="#2a2f3b"/><text x="450" y="672">30-DAY TRACKER</text><text x="850" y="672" fill="#d4af37">›</text>
  </g>
</g>
<g filter="url(#shadow)">
  <rect x="85" y="300" width="300" height="510" rx="48" fill="#05070b" stroke="url(#gold)" stroke-width="6"/>
  <rect x="105" y="340" width="260" height="430" rx="28" fill="#071225"/>
  <rect x="185" y="318" width="100" height="15" rx="8" fill="#141820"/>
  <text x="135" y="415" fill="url(#gold)" font-family="Georgia,serif" font-size="34" letter-spacing="2">PINTEREST</text>
  <text x="155" y="460" fill="url(#gold)" font-family="Georgia,serif" font-size="34" letter-spacing="2">GROWTH</text>
  <text x="160" y="505" fill="url(#gold)" font-family="Georgia,serif" font-size="34" letter-spacing="2">STUDIO</text>
  <g font-family="Montserrat,Arial,sans-serif" font-size="16" fill="#fff" letter-spacing="1">
    <rect x="125" y="550" width="220" height="55" rx="10" fill="#0d1017" stroke="#2a2f3b"/><text x="145" y="584">PIN REVIEW</text>
    <rect x="125" y="625" width="220" height="55" rx="10" fill="#0d1017" stroke="#2a2f3b"/><text x="145" y="659">LESSONS</text>
    <rect x="125" y="700" width="220" height="55" rx="10" fill="#0d1017" stroke="#2a2f3b"/><text x="145" y="734">30-DAY TRACKER</text>
  </g>
</g>
<g transform="rotate(4 950 690)" filter="url(#shadow)">
  <rect x="760" y="585" width="385" height="220" rx="22" fill="#071225" stroke="url(#gold)" stroke-width="5"/>
  <text x="820" y="660" fill="url(#gold)" font-family="Georgia,serif" font-size="38" letter-spacing="2">PINTEREST</text>
  <text x="830" y="708" fill="url(#gold)" font-family="Georgia,serif" font-size="38" letter-spacing="2">GROWTH STUDIO</text>
  <line x1="835" y1="730" x2="1070" y2="730" stroke="#d4af37" stroke-width="2"/>
  <text x="825" y="770" fill="#fff" font-family="Montserrat,Arial,sans-serif" font-size="14" letter-spacing="2">PIN REVIEW • LESSONS • 30-DAY TRACKER</text>
</g>
</svg>